<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LandSimplex</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.2.1/ol.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
      #panel { background: #f7f7f5; border-right: 1px solid #ddd; padding: 16px; overflow-y: auto; }
      #map { width: 100%; height: 100%; background: #e8e8e6; }
      h2 { font-size: 14px; font-weight: 600; margin: 16px 0 8px; color: #444; }
      h2:first-child { margin-top: 0; }
      .raster-item { padding: 8px; border: 1px solid #e0e0dd; border-radius: 4px; margin-bottom: 6px; background: white; cursor: pointer; font-size: 13px; }
      .raster-item:hover { border-color: #888; }
      .raster-item.active { border-color: #1a73e8; background: #e8f0fe; }
      .raster-item .meta { color: #888; font-size: 11px; margin-top: 2px; }
      button { padding: 6px 12px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer; font-size: 13px; }
      button:hover { border-color: #888; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .upload { margin-bottom: 12px; }
      .upload input[type=file] { font-size: 12px; }
      .job { font-size: 12px; padding: 6px 8px; background: white; border-radius: 4px; margin-top: 4px; border-left: 3px solid #1a73e8; }
      .job.failed { border-left-color: #d33; }
      .job.succeeded { border-left-color: #2a8; }
      select { width: 100%; padding: 4px; font-size: 13px; margin-bottom: 8px; }
      .algo-form { padding: 8px; background: white; border-radius: 4px; margin-top: 8px; }
      label { display: block; font-size: 12px; color: #666; margin: 4px 0 2px; }
      .layer-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 2px 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="panel"></aside>
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
