[project]
name = "landsimplex-backend"
version = "1.0.1b1"
description = "LandSimplex backend - simplex-sampled weight-space sensitivity for raster suitability analysis"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",   # used by FastAPI TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
